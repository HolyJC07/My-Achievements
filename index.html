<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            line-height: 1.6;
        }
        h1 {
            font-size: 4rem;
            color: #00f1ff;
            margin-top: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header {
            background: #1a1a2e;
            padding: 50px 0;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.8);
        }
        .intro {
            margin: 20px 0;
            font-size: 1.5rem;
            color: #bbb;
        }
        .section {
            padding: 100px 0;
            background: #16213e;
            margin-top: 50px;
        }
        .projects {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 50px;
        }
        .project {
            background: #222;
            width: 250px;
            height: 300px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
        }
        .project:hover {
            transform: scale(1.05);
        }
        .project img {
            width: 100%;
            height: 60%;
            border-radius: 10px 10px 0 0;
            object-fit: cover;
        }
        .project h3 {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #00f1ff;
        }
        footer {
            background: #1a1a2e;
            color: #888;
            padding: 30px 0;
            font-size: 1rem;
        }
        .socials {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .socials a {
            color: #888;
            text-decoration: none;
            font-size: 1.5rem;
            transition: color 0.3s;
        }
        .socials a:hover {
            color: #00f1ff;
        }
    </style>
</head>
<body>

<header>
    <h1>My Sci-Fi Portfolio</h1>
    <p class="intro">Welcome to my futuristic portfolio where I showcase my creative projects and digital artworks.</p>
</header>

<section class="section">
    <h2>My Projects</h2>
    <div class="projects">
        <div class="project">
            <img src="https://via.placeholder.com/250x150" alt="Project 1">
            <h3>Project One</h3>
        </div>
        <div class="project">
            <img src="https://via.placeholder.com/250x150" alt="Project 2">
            <h3>Project Two</h3>
        </div>
        <div class="project">
            <img src="https://via.placeholder.com/250x150" alt="Project 3">
            <h3>Project Three</h3>
        </div>
    </div>
</section>

<footer>
    <p>&copy; 2025 My Portfolio. All Rights Reserved.</p>
    <div class="socials">
        <a href="https://twitter.com" target="_blank">Twitter</a>
        <a href="https://linkedin.com" target="_blank">LinkedIn</a>
        <a href="https://github.com" target="_blank">GitHub</a>
    </div>
</footer>

</body>
</html>
